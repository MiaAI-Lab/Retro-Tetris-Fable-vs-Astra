:root {
  --background: #e9e5d7;
  --foreground: #343a33;
  --primary: #354939;
  --border: #aaa99b;
  --font-sans: Arial,sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--foreground);
  background: var(--background);
  font-family: Arial,sans-serif;
  background-image: linear-gradient(#7478650c 1px,transparent 1px),linear-gradient(90deg,#7478650c 1px,transparent 1px);
  background-size: 25px 25px;
}
body:after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 30;
  opacity: .15;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' filter='url(%23n)' opacity='.6' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}
main {
  max-width: 1500px;
  margin: auto;
  padding: 0 5vw;
}
header {
  height: 92px;
  border-bottom: 1px solid #77796b55;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.wordmark {
  font: 700 15px 'Courier New',monospace;
  letter-spacing: 2px;
  color: inherit;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 12px;
}
.wordmark b {
  font-size: 34px;
  line-height: 1;
}
.wordmark small {
  font-size: 11px;
  font-weight: 400;
  border-left: 1px solid #929587;
  padding-left: 14px;
  margin-left: 8px;
}
header em {
  font-family: Georgia,serif;
  font-size: 14px;
  color: #77796b;
}
header>span {
  font: 11px 'Courier New',monospace;
  letter-spacing: 1px;
}
.game-layout {
  display: grid;
  grid-template-columns: 230px minmax(260px,360px) 190px;
  gap: 60px;
  justify-content: center;
  align-items: start;
  margin: 38px auto 27px;
}
.intro {
  padding-top: 23px;
}
.eyebrow,h2,.board-heading,.board-footer,.grain-label {
  font: 12px 'Courier New',monospace;
  letter-spacing: 1.5px;
  font-weight: 700;
}
h1 {
  font-family: Georgia,'Times New Roman',serif;
  font-size: 76px;
  font-weight: 400;
  line-height: .98;
  letter-spacing: -4px;
  margin: 22px 0;
}
h1 span {
  color: #b24e38;
}
.description {
  font-family: Georgia,serif;
  font-size: 18px;
  line-height: 1.6;
  color: #747668;
}
.color-line {
  display: flex;
  gap: 5px;
  margin-top: 26px;
  transform: rotate(-2deg);
}
.color-line i {
  height: 7px;
  width: 23px;
}
.hold-section {
  margin-top: 51px;
  width: 162px;
}
h2 {
  margin: 0 0 16px;
}
.hold-section h2 {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.hold-box {
  border: 1px dashed #929485;
  margin-top: 13px;
  height: 105px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.hold-box em {
  font: italic 12px Georgia,serif;
  color: #7c7e70;
}
.piece-preview {
  position: relative;
  width: 92px;
  height: 46px;
}
.piece-preview:empty {
  height: 10px;
}
.piece-preview i {
  position: absolute;
  width: 23px;
  height: 23px;
  border: 1px solid #354034b3;
  box-shadow: inset 0 0 0 2px #ffffff20;
  background-image: repeating-linear-gradient(135deg,transparent 0 2px,#ece2c83b 3px,transparent 4px);
}
.personal-best {
  margin-top: 31px;
}
.personal-best h2 {
  color: #737567;
  font-size: 11px;
}
.personal-best strong {
  font: 25px 'Courier New',monospace;
  letter-spacing: 2px;
}
.hand-note {
  font: italic 19px Georgia,serif;
  transform: rotate(-9deg);
  margin-top: 38px;
  color: #858474;
}
.board-heading {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  margin-bottom: 11px;
  letter-spacing: 1px;
}
.board-heading i {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #93937e;
  border-radius: 50%;
  margin-right: 7px;
}
.board-heading i.live {
  background: #4f764a;
  box-shadow: 0 0 0 3px #4f764a15;
}
.board-frame {
  position: relative;
  border: 2px solid #50594a;
  box-shadow: 3px 4px 0 #50594a20,0 0 0 5px #e9e5d7,0 0 0 6px #83857566;
  width: 100%;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1/2;
  background: #dfdfcd;
}
.board-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e7e4d142;
}
.overlay-paper {
  background: #ede9dcf2;
  padding: 30px 23px;
  text-align: center;
  width: 89%;
  border: 1px solid #85887966;
  box-shadow: 3px 5px 0 #424e351c;
  transform: rotate(-2deg);
}
.overlay-paper h2 {
  font: 33px/1.1 Georgia,serif;
  letter-spacing: -1px;
  margin: 18px 0;
  white-space: pre-line;
}
.overlay-paper p {
  font: 14px/1.6 Georgia,serif;
  color: #6d7365;
  margin-bottom: 25px;
}
.primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  color: #f2eddf;
  background: #374d3c;
  border: 1px solid #263d2c;
  width: 100%;
  padding: 15px 12px;
  font: 15px 'Courier New',monospace;
  box-shadow: 2px 3px 0 #283b2526;
}
.primary span {
  margin-left: auto;
}
.overlay-paper small {
  display: block;
  font: 11px 'Courier New',monospace;
  margin-top: 15px;
  color: #7c7d70;
}
.board-footer {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  margin-top: 15px;
  letter-spacing: .5px;
}
.right-panel {
  padding-top: 24px;
}
.next-box {
  height: 115px;
  border: 1px solid #7f8776;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f2efdf33;
  box-shadow: 2px 2px 0 #5a625514;
}
.next-box .piece-preview {
  transform: scale(1.15);
}
.score-section {
  margin-top: 35px;
}
.score-section h2 {
  margin-bottom: 10px;
}
.score {
  font: 38px 'Courier New',monospace;
  letter-spacing: -2px;
}
.stats {
  display: flex;
  gap: 46px;
  margin-top: 26px;
}
.stats strong {
  font: 32px 'Courier New',monospace;
}
.game-buttons {
  margin-top: 35px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
button {
  cursor: pointer;
  transition: background .15s,transform .15s;
}
button:hover {
  background-color: #d5d7c5;
}
button.primary:hover {
  background: #476149;
  transform: translateY(-1px);
}
button:focus-visible {
  outline: 3px solid #ae583c;
  outline-offset: 4px;
}
button:disabled {
  opacity: .42;
  cursor: default;
}
.game-buttons button,.audio-controls button {
  display: flex;
  align-items: center;
  gap: 11px;
  background: transparent;
  border: 1px solid #989c8d;
  padding: 12px 10px;
  color: inherit;
  font-size: 14px;
}
.game-buttons button:hover,.audio-controls button:hover {
  background: #d9dccb;
}
.game-buttons kbd {
  margin-left: auto;
}
kbd {
  font: 11px 'Courier New',monospace;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #a4a898;
  min-width: 21px;
  min-height: 20px;
  padding: 1px 4px;
  border-radius: 3px;
  background: #f1efdf75;
  color: #68715f;
  box-shadow: 0 1px 0 #a4a898;
}
.audio-controls {
  margin-top: 27px;
  padding-top: 15px;
  border-top: 1px solid #9ca18d66;
}
.audio-controls button {
  border: 0;
  width: 100%;
  padding: 10px 0;
}
.audio-controls span {
  margin-left: auto;
  font: 10px 'Courier New',monospace;
  border: 1px solid #a1a58f;
  padding: 3px 5px;
}
.audio-controls button[aria-pressed=true] span {
  background: #d0d7bd;
  color: #415837;
}
.grain-label {
  font-size: 9px;
  letter-spacing: 1px;
  margin-top: 20px;
  display: flex;
  align-items: center;
  color: #737d66;
}
.grain-label i {
  height: 4px;
  width: 4px;
  border-radius: 50%;
  background: #73825e;
  margin-left: auto;
}
footer {
  border-top: 1px solid #8d94816b;
  padding: 22px 0;
  display: flex;
  gap: 24px;
  align-items: center;
  font-size: 12px;
  color: #6e7666;
}
footer>span {
  display: flex;
  gap: 6px;
  align-items: center;
}
footer small {
  font-size: 11px;
  color: #858b7b;
}
.footer-end {
  margin-left: auto;
  font: 10px 'Courier New',monospace;
  letter-spacing: 1px;
}
.touch-controls {
  display: none;
}
@media (min-width:1000px) and (max-height:950px) {
  .game-layout {
    grid-template-columns: 220px minmax(240px,300px) 180px;
    gap: 55px;
    margin-top: 28px;
  }
  .hold-section {
    margin-top: 28px;
  }
  h1 {
    font-size: 69px;
  }
  .hand-note {
    margin-top: 22px;
  }
  header {
    height: 78px;
  }
}
@media (max-width:950px) {
  main {
    padding: 0 25px;
  }
  .game-layout {
    grid-template-columns: 170px minmax(220px,300px) 145px;
    gap: 25px;
  }
  h1 {
    font-size: 59px;
  }
  header em {
    display: none;
  }
  .stats {
    gap: 28px;
  }
  .score {
    font-size: 32px;
  }
  .hold-section {
    width: 140px;
  }
  footer {
    gap: 15px;
  }
  .footer-end {
    display: none;
  }
}
@media (max-width:700px) {
  main {
    padding: 0 18px;
  }
  header {
    height: 68px;
  }
  header>span,.wordmark small {
    display: none;
  }
  .game-layout {
    grid-template-columns: minmax(170px,300px) 112px;
    gap: 18px;
    margin: 23px auto;
  }
  .intro {
    display: none;
  }
  .right-panel {
    padding-top: 21px;
  }
  .next-box {
    height: 88px;
  }
  .score {
    font-size: 26px;
  }
  .stats {
    gap: 18px;
  }
  .stats strong {
    font-size: 27px;
  }
  h2 {
    font-size: 11px;
    letter-spacing: 1px;
  }
  .score-section {
    margin-top: 25px;
  }
  .game-buttons {
    margin-top: 24px;
  }
  .game-buttons button {
    font-size: 12px;
    gap: 5px;
    padding: 10px 5px;
  }
  .game-buttons kbd {
    display: none;
  }
  .audio-controls button {
    font-size: 12px;
    gap: 6px;
  }
  .grain-label {
    font-size: 8px;
    letter-spacing: 0;
  }
  .board-heading {
    font-size: 8px;
  }
  .board-footer {
    font-size: 8px;
  }
  .overlay-paper {
    padding: 24px 13px;
  }
  .overlay-paper h2 {
    font-size: 26px;
  }
  .overlay-paper p {
    font-size: 13px;
  }
  .touch-controls {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-bottom: 22px;
  }
  .touch-controls button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 8px;
    border: 1px solid #89927c;
    background: #e3e5d3;
    color: #3f4d35;
    touch-action: manipulation;
    font: 11px 'Courier New',monospace;
  }
  .touch-controls svg {
    width: 19px;
  }
  footer {
    justify-content: center;
    flex-wrap: wrap;
    padding: 17px 0;
    font-size: 10px;
    gap: 12px;
  }
  footer small {
    display: none;
  }
}
